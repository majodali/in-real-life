<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<title>in·real·life</title>

<!--
  Runtime configuration. The committed file contains placeholders; the
  deploy tooling replaces this block with the values for whichever stack
  is being deployed (from that stack's CDK outputs). For local dev, copy
  this file to app.local.html and fill in real values from your stack.
-->
<script>
  window.__IRL_CONFIG__ = {
    apiBaseUrl: '__IRL_API_BASE_URL__',
    cognitoRegion: '__IRL_COGNITO_REGION__',
    cognitoUserPoolId: '__IRL_COGNITO_USER_POOL_ID__',
    cognitoUserPoolClientId: '__IRL_COGNITO_USER_POOL_CLIENT_ID__',
    feedbackUrl: '__IRL_FEEDBACK_URL__',
    // Workshop stacks isolate identity per browser tab (sessionStorage
    // tokens) so facilitators can drive several personas side by side.
    workshopMode: '__IRL_WORKSHOP_MODE__' === 'true',
  };
</script>

</head>
<body>

<div class="app" id="app">
  <div class="screen" id="screen-location"></div>
  <div class="screen" id="screen-signup"></div>
  <div class="screen" id="screen-confirm"></div>
  <div class="screen" id="screen-signin"></div>
  <div class="screen" id="screen-welcome"></div>
  <div class="screen" id="screen-agreement"></div>
  <div class="screen onboarding" id="screen-onboarding"></div>
  <div class="screen" id="screen-locality"></div>
  <div class="screen" id="screen-feed"></div>
  <div class="screen" id="screen-profile"></div>
  <div class="screen" id="screen-admin"></div>
  <div class="screen" id="screen-propose"></div>
  <div class="screen" id="screen-event"></div>
  <div class="screen" id="screen-edit"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { init } from './js/app.js';
  init();
</script>

</body>
</html>
