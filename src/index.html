<!--
  The landing page: Direction D, chosen 2026-10-21 (U12); revised at
  the chunk-4 gate. 2026-10-22: the rotating tagline replaces B's
  eyebrow, and on phones the early-days notice sits at the bottom.
  2026-10-23: the tagline gets its own full-width band, the headline
  spans the page, and the example week is a narrower calendar of
  compact agenda rows. Its reasoning
  and the judgment that picked it live in
  design/landing-directions-2026-09.md; the drawn previews it came from
  are archived beside that note.

  The words are in src/copy/en-US/ (landing.js, and site.js for the
  header and footer) and are filled in at deploy
  (infrastructure/scripts/render-copy.mjs).

  `class="lp"` scopes the public-page styles in css/styles.css (the
  "Public pages" section) and gives this page ordinary document
  scrolling — the app shell's html/body are overflow: hidden.

  Public pages carry only the workshop flag (the deploy tooling
  substitutes it, as it does for app.html). theme.js reads it to decide
  whether to offer the design switcher; the chosen theme itself comes
  from localStorage and applies on every page.
-->
<script>
  window.__IRL_CONFIG__ = { workshopMode: '__IRL_WORKSHOP_MODE__' === 'true' };
</script>

<script type="module">
  // Enhancements only: without JavaScript the page still reads and every
  // link still works (a fixed tagline, an unpinned introduction).
  import * as store from './js/store.js';
  import { pickActiveTagline } from './js/taglines.js';

  // Sign-up and sign-in start from a clean slate: any persona left active
  // in this browser is cleared first.
  for (const link of document.querySelectorAll('[data-auth]')) {
    link.addEventListener('click', () => store.clearActiveUser());
  }

  // A different tagline each visit (taglines.js; review page: taglines.html).
  const tagline = pickActiveTagline();
  document.getElementById('taglineText').textContent = tagline.text;
  document.getElementById('taglineBy').textContent = tagline.attribution ?? '';

  // Layout that depends on measured heights (css/styles.css → Public pages):
  // the phone's bottom notice reserves exactly its own height, and the
  // desktop introduction pins beside the week only when all of it fits.
  const root = document.documentElement;
  const bar = document.querySelector('.lp-notice-bar');
  const intro = document.querySelector('.lp-intro');
  const wide = window.matchMedia('(min-width: 1080px)');
  const fit = () => {
    root.style.setProperty('--lp-notice-h', `${bar.offsetHeight}px`);
    intro.classList.toggle('lp-pin', wide.matches && intro.offsetHeight + 48 <= window.innerHeight);
  };
  fit();
  window.addEventListener('resize', fit);
  document.fonts?.ready.then(fit);
</script>
