name: CI

on:
  pull_request:
  push:
    branches: [main]

# OIDC token requests need id-token: write. The default is read for
# everything else.
permissions:
  id-token: write
  contents: read

# Serialise deploys to the test stack so concurrent pushes don't race
# on the shared DynamoDB / Cognito resources.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install backend deps
        working-directory: infrastructure
        run: npm ci

      - name: Frontend unit tests
        # The same command a contributor runs: `npm test` in src/ (its
        # package.json finds every js/**/*.test.mjs with find + xargs —
        # non-interactive bash has no globstar, and node --test neither
        # expands globs nor discovers a directory's tests reliably).
        # No dependencies, so no install step.
        working-directory: src
        run: npm test

      - name: Backend unit tests
        working-directory: infrastructure
        run: npm test

  deploy-test:
    name: Deploy IrlStackTest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install backend deps
        working-directory: infrastructure
        run: npm ci

      - name: Configure AWS credentials (test role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-ci-deploy-test

      - name: cdk deploy IrlStackTest
        working-directory: infrastructure
        run: npx cdk deploy IrlStackTest --require-approval never

  functional-tests:
    name: Functional tests against IrlStackTest
    needs: deploy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Install backend deps
        working-directory: infrastructure
        run: npm ci

      - name: Configure AWS credentials (test role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TEST_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-ci-functional

      - name: Run functional tests
        working-directory: infrastructure
        env:
          TEST_STACK_NAME: IrlStackTest
        run: npm run test:functional
